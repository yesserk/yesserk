name: 🐍 Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"      # Exécution automatique tous les jours à minuit UTC
  workflow_dispatch:          # Permet un lancement manuel depuis l'onglet Actions
  push:
    branches:
      - main                  # Se relance à chaque push sur main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Générer le serpent 🐍
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
